<!doctype html><html lang="ko"><meta charset="utf-8"><title>tPA 체중 입력 데모</title>
<style>body{font:18px 'Malgun Gothic',sans-serif;max-width:900px;margin:48px auto;padding:0 24px;color:#173b60}label{display:block;margin:18px 0}input,select,button{font:inherit;padding:9px}pre{white-space:pre-wrap;background:#f2f5f7;padding:20px;color:#18232b}small{color:#555}</style>
<h1>체중 입력과 예상 용량</h1><p>합성 데이터 연구용 데모입니다. 실제 처방·투약을 생성하지 않습니다.</p>
<form id="form"><label>체중 kg <input id="weight" type="number" step="0.1" min="0.1" value="67" required></label>
<label>체중 출처 <select id="method"><option value="MEASURED">실측</option><option value="PATIENT_REPORTED">환자 자술</option><option value="CAREGIVER_REPORTED">보호자 자술</option><option value="ESTIMATED">추정</option></select></label>
<button>예상 용량 계산</button></form><p id="message" role="status"></p><pre id="result">체중과 출처를 입력하세요.</pre>
<small>계산은 Python의 동일한 Decimal 계산 모듈을 사용합니다. 의료진 확인이 필요합니다.</small>
<script>document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const out=document.querySelector('#result');try{const r=await fetch('/weight-preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({weight_kg:Number(document.querySelector('#weight').value),method:document.querySelector('#method').value})});const data=await r.json();document.querySelector('#message').textContent=r.ok?'계산 완료. 연구용 미리보기입니다.':'입력값을 확인하세요.';out.textContent=JSON.stringify(data,null,2)}catch(error){out.textContent='서버 연결을 확인하세요.'}});</script></html>
